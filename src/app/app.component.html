<div class="min-h-screen flex flex-col bg-app-gradient bg-app-gradient-animated text-slate-900 dark:text-slate-100 transition-colors duration-500">
  <button type="button" (click)="toggleTheme()"
          class="fixed top-4 right-4 z-50 rounded-full p-3 border border-blue-900/10 backdrop-blur shadow-brand bg-white/80 text-blue-900 hover:bg-white dark:border-slate-700 dark:bg-slate-800/80 dark:text-amber-300"
          aria-label="Toggle theme">
    <span class="material-symbols-outlined align-middle">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
  </button>
  <router-outlet></router-outlet>
</div>
