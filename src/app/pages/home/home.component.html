<div class="min-h-[60vh]">
  <!-- Logged out landing -->
  <div *ngIf="authed === false" class="mx-auto max-w-3xl text-center py-16">
    <h2 class="text-3xl font-semibold mb-3">Tell your story with Slides</h2>
    <p class="text-gray-600 mb-6">Design compelling presentations and collaborate in real time.</p>
    <div class="flex items-center justify-center gap-3">
      <a class="px-4 py-2 rounded bg-blue-600 text-white" href="http://berjis.test">Get Started</a>
      <a class="px-4 py-2 rounded border" routerLink="/slide/demo">Try Demo</a>
    </div>
  </div>

  <!-- Logged in recents -->
  <div *ngIf="authed === true" class="max-w-4xl mx-auto py-8">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xl font-semibold">Recent Decks</h3>
      <a routerLink="/slide/new" class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white">New Deck</a>
    </div>
    <ul class="divide-y border rounded">
      <li *ngFor="let s of recents" class="p-3 flex items-center justify-between">
        <div>
          <div class="font-medium">{{ s.title }}</div>
          <div class="text-xs text-gray-500">Updated {{ s.updatedAt | date:'medium' }}</div>
        </div>
        <a [routerLink]="['/slide', s.id]" class="text-blue-600 text-sm">Open</a>
      </li>
    </ul>
  </div>

  <!-- Loading -->
  <div *ngIf="authed === null" class="py-16 text-center text-gray-500">Checking your session.</div>
</div>
